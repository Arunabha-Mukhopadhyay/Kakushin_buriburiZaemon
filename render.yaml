services:
  # 1. FastAPI Python 9-Agent AI Pipeline
  - type: web
    name: finmate-agents
    runtime: docker
    dockerfilePath: backend/agents/Dockerfile
    dockerContext: backend/agents
    plan: free
    region: oregon
    healthCheckPath: /
    envVars:
      - key: PORT
        value: 8000
      - key: GROQ_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false

  # 2. Node.js Express API & Voice Proxy Server
  - type: web
    name: finmate-server
    runtime: node
    rootDir: backend/server
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: AGENT_API_URL
        fromService:
          type: web
          name: finmate-agents
          property: host
      - key: DATABASE_URL
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_AGENT_ID
        sync: false

  # 3. React Vite Frontend
  - type: web
    name: finmate-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: finmate-agents
          property: host
      - key: VITE_SERVER_BASE_URL
        fromService:
          type: web
          name: finmate-server
          property: host
      - key: VITE_USE_MOCK
        value: "false"
