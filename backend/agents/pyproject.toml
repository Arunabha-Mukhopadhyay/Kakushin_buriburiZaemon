[project]
name = "arthsaathi-agents"
version = "0.1.0"
description = "ArthSaathi — 9-Agent LangGraph Pipeline (FastAPI)"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "langgraph==0.2.69",
    "langchain-core==0.3.0",
    "langchain-google-genai==2.0.0",
    "sentence-transformers==3.0.1",
    "faiss-cpu==1.8.0",
    "numpy==1.26.4",
    "scipy==1.13.1",
    "python-dotenv==1.0.1",
    "pydantic==2.8.2",
    "httpx==0.27.2",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
